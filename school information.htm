<!DOCTYPE html>
<html>
<head>
    <title>School Search</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        #searchBox {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 10px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 8px;
            background: #f2f2f2;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <h2>Search School Information</h2>

    <input type="text" id="searchBox" placeholder="Search for courses, teachers..." onkeyup="searchFunction()">

    <ul id="results">
        <li>Mathematics</li>
        <li>English</li>
        <li>Biology</li>
        <li>Physics</li>
        <li>Computer Studies</li>
        <li>Mr. John - Mathematics Teacher</li>
        <li>Ms. Sarah - English Teacher</li>
        <li>Admissions</li>
        <li>Contact Page</li>
    </ul>

    <script>
        function searchFunction() {
            let input = document.getElementById("searchBox").value.toLowerCase();
            let items = document.getElementById("results").getElementsByTagName("li");

            for (let i = 0; i < items.length; i++) {
                let text = items[i].textContent.toLowerCase();

                if (text.includes(input)) {
                    items[i].style.display = "";
                } else {
                    items[i].style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
